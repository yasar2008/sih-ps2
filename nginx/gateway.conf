# AICTE APAAR National Portal - Enterprise API Gateway
# Compliance: GIGW 3.0, CERT-In Cyber Security Guidelines, OWASP Top 10

# Rate Limiting Zones (Token Bucket Algorithm)
limit_req_zone $binary_remote_addr zone=public_verify_limit:10m rate=15r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=general_api_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=bulk_upload_limit:10m rate=10r/m;

# Upstream Backend Services
upstream backend_core {
    server backend-core:5000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream mock_gov_sandbox {
    server mock-gov-api:5050 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

upstream frontend_app {
    server frontend:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost aicte-apaar.gov.in *.aicte-apaar.gov.in;

    # Server Signature Obfuscation (CERT-In Directive)
    server_tokens off;

    # Client Request Buffers & Timeouts
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 20s;
    keepalive_timeout 65;

    # Default payload size limit (2 Megabytes)
    client_max_body_size 2M;

    # GIGW 3.0 & CERT-In Mandatory Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' http://localhost:* ws://localhost:* https://*.gov.in;" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # -------------------------------------------------------------
    # 1. Institutional Bulk Upload Endpoint (Special payload ceiling)
    # -------------------------------------------------------------
    location /api/v1/institution/bulk-upload {
        limit_req zone=bulk_upload_limit burst=5 nodelay;
        client_max_body_size 50M; # Allowed up to 50MB for signed institutional batches

        proxy_pass http://backend_core;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # -------------------------------------------------------------
    # 2. Public Instant Credential Verification (Rate Limited)
    # -------------------------------------------------------------
    location /api/v1/verify/ {
        limit_req zone=public_verify_limit burst=10 nodelay;

        proxy_pass http://backend_core;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------
    # 3. Authentication & MeriPehchaan SSO Handshake
    # -------------------------------------------------------------
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass http://backend_core;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------
    # 4. General Core API Routes
    # -------------------------------------------------------------
    location /api/ {
        limit_req zone=general_api_limit burst=20 nodelay;

        proxy_pass http://backend_core;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------
    # 5. Mock National Gov-API Sandbox Gateway (API Setu / DigiLocker)
    # -------------------------------------------------------------
    location /gov-sandbox/ {
        rewrite ^/gov-sandbox/(.*) /$1 break;
        proxy_pass http://mock_gov_sandbox;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------
    # 6. GIGW 3.0 Compliant Frontend Application
    # -------------------------------------------------------------
    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------
    # 7. CERT-In Non-Leaking Error Pages
    # -------------------------------------------------------------
    error_page 403 /errors/403.html;
    error_page 404 /errors/404.html;
    error_page 500 502 503 504 /errors/500.html;

    location ^~ /errors/ {
        internal;
        root /usr/share/nginx/html;
    }
}
