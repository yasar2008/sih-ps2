apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: adv-isolated-network-policy
  namespace: aicte-apaar-system
spec:
  podSelector:
    matchLabels:
      app: aicte-postgres
  policyTypes:
    - Ingress
  ingress:
    # Only allow ingress from backend-core pods on port 5432
    - from:
        - podSelector:
            matchLabels:
              app: aicte-backend-core
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aicte-gateway-ingress
  namespace: aicte-apaar-system
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-gov-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps: "20"
spec:
  tls:
    - hosts:
        - apaar.aicte-india.gov.in
      secretName: aicte-apaar-tls-cert
  rules:
    - host: apaar.aicte-india.gov.in
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
