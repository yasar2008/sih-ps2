apiVersion: v1
kind: Namespace
metadata:
  name: aicte-apaar-system
  labels:
    app.kubernetes.io/name: aicte-apaar
    gov.in/cloud: meghraj
    compliance: gigw-3.0-cert-in
---
apiVersion: v1
kind: Secret
metadata:
  name: aicte-kms-vault-secrets
  namespace: aicte-apaar-system
type: Opaque
stringData:
  DATABASE_URL: "postgresql://aicte_admin:SecureAictePass2026!@postgres-service:5432/aicte_apaar_db?sslmode=require"
  ADV_DATABASE_URL: "postgresql://adv_vault_user:AdvHsmSecurePass2026!@postgres-service:5432/aicte_apaar_db?sslmode=require"
  REDIS_PASSWORD: "RedisGovSecure2026!"
  KMS_MASTER_KEY_HEX: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  KMS_HMAC_PEPPER_HEX: "fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210"
  JWT_SECRET: "AICTE_NATIONAL_SECURE_JWT_SECRET_GOV_INDIA_2026_CERT_IN"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aicte-apaar-config
  namespace: aicte-apaar-system
data:
  NODE_ENV: "production"
  PORT: "5000"
  AICTE_PLATFORM_KEY_ID: "AICTE-ROOT-HSM-KEY-01"
  RATE_LIMIT_PUBLIC: "15"
  RATE_LIMIT_BULK: "100"
  LOG_RETENTION_DAYS: "180"
  NTP_SERVER: "pool.ntp.gov.in"
