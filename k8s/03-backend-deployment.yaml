apiVersion: apps/v1
kind: Deployment
metadata:
  name: aicte-backend-core
  namespace: aicte-apaar-system
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aicte-backend-core
  template:
    metadata:
      labels:
        app: aicte-backend-core
        tier: api
    spec:
      containers:
        - name: backend-core
          image: registry.meghraj.gov.in/aicte/apaar-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: aicte-apaar-config
            - secretRef:
                name: aicte-kms-vault-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: aicte-apaar-system
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
  selector:
    app: aicte-backend-core
